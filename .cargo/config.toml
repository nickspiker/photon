# Linker configuration for Photon Messenger
#
# mold: Fast linker for native Linux builds (default)
# Redox: Cross-compilation support when explicitly targeting x86_64-unknown-redox
# macOS: osxcross for Intel and Apple Silicon

# Linux ARM64 cross-compilation (from x86_64 host)
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
rustflags = ["-C", "link-arg=--sysroot=/usr/aarch64-redhat-linux/sys-root/fc42", "-C", "link-arg=-L/mnt/Octopus/Code/photon/cross-libs/aarch64", "-C", "link-arg=-Wl,-rpath-link,/mnt/Octopus/Code/photon/cross-libs/aarch64"]

# macOS Intel cross-compilation via osxcross
[target.x86_64-apple-darwin]
linker = "/mnt/Octopus/Code/osxcross/target/bin/x86_64-apple-darwin-clang-wrapper"

# macOS Apple Silicon — default to system clang for native builds on the Mac.
# deploy.sh overrides this via CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER when
# cross-compiling from Linux with osxcross.
[target.aarch64-apple-darwin]
linker = "clang"

# Redox cross-compilation (use when: cargo build --target x86_64-unknown-redox)
[target.x86_64-unknown-redox]
linker = "/mnt/Octopus/Code/redox/prefix/x86_64-unknown-redox/rust-install/bin/x86_64-unknown-redox-gcc"

# Non-glibc GCC cross-targets (MinGW Windows-x64, Redox) need a features.h shim on the C include path so
# pqcrypto-mlkem's PQClean compat.h can #include <features.h> / call __GNUC_PREREQ (glibc-only symbols their
# GCCs lack — see cross-libs/gcc-noglibc-shim/features.h). cc-rs reads CFLAGS_<target> from the environment;
# setting it here makes the fix automatic for dev + deploy, not just deploy.sh. The aarch64 Windows build uses
# clang and takes compat.h's __clang__ branch, so it needs no shim.
[env]
CFLAGS_x86_64_pc_windows_gnu = "-I/mnt/Octopus/Code/photon/cross-libs/gcc-noglibc-shim"
# Redox has its OWN (musl-derived) features.h that its system headers need — but it lacks __GNUC_PREREQ,
# which pqcrypto-mlkem's compat.h requires. So the redox shim #include_next's the real one (dir FIRST on -I)
# and only ADDS the missing macro; a plain replacement stub (like the mingw one) would break relibc's headers.
CFLAGS_x86_64_unknown_redox = "-I/mnt/Octopus/Code/photon/cross-libs/redox-features-shim"
