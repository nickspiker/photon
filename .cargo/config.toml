# Linker configuration for Photon Messenger
#
# mold: Fast linker for native Linux builds (default)
# macOS: osxcross for x86_64 and ARM64

# Linux ARM64 cross-compilation (from x86_64 host)
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
rustflags = ["-C", "link-arg=--sysroot=/usr/aarch64-redhat-linux/sys-root/fc42", "-C", "link-arg=-L/mnt/Harbor/Code/photon/cross-libs/aarch64", "-C", "link-arg=-Wl,-rpath-link,/mnt/Harbor/Code/photon/cross-libs/aarch64"]

# macOS x86_64 cross-compilation via osxcross
[target.x86_64-apple-darwin]
linker = "/mnt/Harbor/Code/osxcross/target/bin/x86_64-apple-darwin-clang-wrapper"

# macOS Apple Silicon — default to system clang for native builds on the Mac.
# deploy.sh overrides this via CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER when
# cross-compiling from Linux with osxcross.
[target.aarch64-apple-darwin]
linker = "clang"

# Non-glibc GCC cross-targets (MinGW Windows-x64) need a features.h shim on the C include path so
# pqcrypto-mlkem's PQClean compat.h can #include <features.h> / call __GNUC_PREREQ (glibc-only symbols their
# GCCs lack — see cross-libs/gcc-noglibc-shim/features.h). cc-rs reads CFLAGS_<target> from the environment;
# setting it here makes the fix automatic for dev + deploy, not just deploy.sh. The aarch64 Windows build uses
# clang and takes compat.h's __clang__ branch, so it needs no shim.
[env]
# Opus: ALWAYS the vendored static build, NEVER the system library. audiopus_sys otherwise probes pkg-config first, so the link depended on distro state — a box with opus headers but no lib died at `-lopus` (field: first outside builder, 2026-08-30), and a box with the lib silently linked libopus.so and shipped a runtime dep. NO_PKG skips the probe, STATIC compiles the vendored C source (CMake) into the binary on every target, same as Android always did.
OPUS_NO_PKG = "1"
OPUS_STATIC = "1"
CFLAGS_x86_64_pc_windows_gnu = "-I/mnt/Harbor/Code/photon/cross-libs/gcc-noglibc-shim"
