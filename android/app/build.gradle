apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.google.gms.google-services'

// TWO NUMBERS, TWO JOBS. versionName is the ONLY correct version — the Cargo.toml crate version (the bible), verbatim, the same string the Rust binary reports via CARGO_PKG_VERSION. It carries the real major.minor.patch and is what humans and Photon's own update check read.
// versionCode is Android's private "is this build newer?" gate: a meaningless monotonic i32 (max 2,147,483,647) that the OS compares to decide whether to accept an update, and NOTHING else reads for meaning. It must NOT encode major.minor.patch — a positional scheme overflows and collides on real numbers (patch alone has been 14648), which is the whole reason the two are separate. So versionCode = the git commit count: stateless, reproducible from any checkout, no stored counter to bump or desync, and it rises by exactly 1 per commit (a few thousand now — decades of headroom under the i32 cap).
def cargoVersion = {
    def toml = new File(rootDir, "../Cargo.toml")
    def m = (toml.text =~ /(?m)^version\s*=\s*"([^"]+)"/)
    if (!m) { throw new GradleException("Could not read version from ${toml} — the APK version must track Cargo.toml") }
    return m[0][1]
}()
def gitCommitCount = {
    def out = new ByteArrayOutputStream()
    def rc = exec {
        commandLine 'git', 'rev-list', '--count', 'HEAD'
        workingDir rootDir
        standardOutput = out
        ignoreExitValue = true
    }
    if (rc.exitValue != 0) { throw new GradleException("git rev-list failed — versionCode is the commit count; the build must run inside the git repo") }
    return out.toString().trim().toInteger()
}()

android {
    namespace 'com.photon.messenger'
    compileSdk 34

    defaultConfig {
        applicationId "com.photon.messenger"
        minSdk 26  // API 26 for IMEI access and modern features
        targetSdk 34
        versionCode gitCommitCount
        versionName cargoVersion

        // ARM64 only
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            // Canonical TOKEN signing key — every one of Nick's Android apps signs with the SAME keystore + alias ('token') so they share a deterministic per-device ANDROID_ID (TOKEN auth across the whole app family).
            // FAIL LOUDLY if the keystore env isn't set: the old `?: "/dev/null"` fallback silently produced a junk-signed APK that couldn't update the installed app AND would have gotten a different ANDROID_ID — corrupting the very shared identity this key exists for.
            // A missing keystore must abort the release build, not produce a wrongly-signed artifact.
            def ksPath = System.getenv("TOKEN_KEYSTORE_PATH")
            def ksPass = System.getenv("TOKEN_KEYSTORE_PASSWORD")
            if (!ksPath || !ksPass) {
                throw new GradleException("Release signing requires TOKEN_KEYSTORE_PATH and TOKEN_KEYSTORE_PASSWORD (the canonical 'token' key shared by all apps). Build via the deploy script that sets them; refusing to sign with a fallback key.")
            }
            storeFile file(ksPath)
            storePassword ksPass
            keyAlias System.getenv("TOKEN_KEY_ALIAS") ?: "token"
            keyPassword System.getenv("TOKEN_KEY_PASSWORD") ?: ksPass
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    // Native libraries location
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:34.6.0')
    implementation 'com.google.firebase:firebase-messaging'
}
